# Local profile: H2 in PostgreSQL mode so the app runs without Docker/Postgres.
spring:
  datasource:
    url: jdbc:h2:file:./data/workfora;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

workfora:
  jwt:
    secret: local-dev-only-secret-key-please-change-in-production-32+
